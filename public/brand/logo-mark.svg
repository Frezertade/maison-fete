<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="Lancaster Decorators monogram">
  <defs>
    <linearGradient id="gold" x1="10" y1="8" x2="110" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8D5B0"/>
      <stop offset="0.45" stop-color="#C9A87C"/>
      <stop offset="1" stop-color="#A8895A"/>
    </linearGradient>
  </defs>
  <!-- Decorative ring -->
  <circle cx="60" cy="56" r="48" stroke="url(#gold)" stroke-width="1" opacity="0.55"/>
  <circle cx="60" cy="56" r="44" stroke="url(#gold)" stroke-width="0.5" opacity="0.35"/>

  <!-- Interlocking M -->
  <path
    d="M28 78 V34 L42 62 L56 34 V78"
    stroke="url(#gold)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- Interlocking F -->
  <path
    d="M58 34 H92 M58 34 V78 M58 54 H84"
    stroke="url(#gold)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- Overlap flourish curve -->
  <path
    d="M52 48 C62 40, 72 42, 78 50"
    stroke="url(#gold)"
    stroke-width="1.25"
    stroke-linecap="round"
    fill="none"
    opacity="0.85"
  />

  <!-- Tiny peony accent top-right -->
  <g transform="translate(86 22) scale(0.55)" stroke="url(#gold)" stroke-width="1.2" fill="none" opacity="0.9">
    <circle cx="12" cy="12" r="5"/>
    <path d="M12 4 C14 8, 16 9, 18 12 C16 14, 14 16, 12 20 C10 16, 8 14, 6 12 C8 9, 10 8, 12 4Z"/>
    <path d="M4 14 C8 12, 10 10, 12 6"/>
    <path d="M20 14 C16 12, 14 10, 12 6"/>
  </g>

  <!-- Tiny peony accent bottom-left -->
  <g transform="translate(22 72) scale(0.45)" stroke="url(#gold)" stroke-width="1.2" fill="none" opacity="0.85">
    <circle cx="12" cy="12" r="5"/>
    <path d="M12 4 C14 8, 16 9, 18 12 C16 14, 14 16, 12 20 C10 16, 8 14, 6 12 C8 9, 10 8, 12 4Z"/>
  </g>
</svg>
